plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Signing credentials are stored only in the ignored local.properties file.
def signingProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        signingProperties.load(reader)
    }
}

android {
    namespace 'com.autoai.media.qqmusic'
    compileSdk 34

    defaultConfig {
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        debugConfig {
            def signingStorePath = signingProperties.getProperty("signing.debug.storeFile")
            if (signingStorePath) {
                storeFile rootProject.file(signingStorePath)
            }
            storePassword signingProperties.getProperty("signing.debug.storePassword")
            keyAlias signingProperties.getProperty("signing.debug.keyAlias")
            keyPassword signingProperties.getProperty("signing.debug.keyPassword")
        }
        releaseConfig {
            def signingStorePath = signingProperties.getProperty("signing.release.storeFile")
            if (signingStorePath) {
                storeFile rootProject.file(signingStorePath)
            }
            storePassword signingProperties.getProperty("signing.release.storePassword")
            keyAlias signingProperties.getProperty("signing.release.keyAlias")
            keyPassword signingProperties.getProperty("signing.release.keyPassword")
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debugConfig
        }
        release {
            signingConfig signingConfigs.releaseConfig
        }
    }

    flavorDimensions += 'edition'

    productFlavors {
        create('official') {
            dimension = 'edition'
            applicationId = 'com.autoai.media.qqmusic'
        }

        // AGP reserves flavor names starting with 'test'.
        create('qa') {
            dimension = 'edition'
            applicationId = 'com.autoai.media.qqmusic.test'
            isDefault true
        }

        create('customer') {
            dimension = 'edition'
            applicationId = 'com.customer.media.qqmusic'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.fragment:fragment-ktx:1.7.1'
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.media:media:1.7.0'
    // media3 暂时不用
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-session:1.3.1'
}
