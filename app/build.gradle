plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.autoai.media.qqmusic'
    compileSdk 34

    defaultConfig {
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    flavorDimensions += 'edition'

    productFlavors {
        create('official') {
            dimension = 'edition'
            applicationId = 'com.autoai.media.qqmusic'
        }

        // AGP reserves flavor names starting with 'test'.
        create('qa') {
            dimension = 'edition'
            applicationId = 'com.autoai.media.qqmusic.test'
        }

        create('customer') {
            dimension = 'edition'
            applicationId = 'com.customer.media.qqmusic'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.fragment:fragment-ktx:1.7.1'
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.media:media:1.7.0'
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
}
